name: Scrape dou data

on: 
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [feature/automation]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout to branch
        uses: actions/checkout@v7
      
      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      
      - name: Install requirements and run main.py
        run: |
          pip install -r requirements.txt
          python ./src/main.py
      - name: Setup user configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add new version of vacancies if exists
        run: |
          git add data/vacancies.db
          git diff --staged --quiet || git commit -m "Scraped $(date)+%F"
          git pull
          git push